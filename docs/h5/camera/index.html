<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>摄像头手动聚焦功能</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
        color: white;
        min-height: 100vh;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .container {
        max-width: 1000px;
        width: 100%;
        margin: 0 auto;
        padding: 20px;
      }

      header {
        text-align: center;
        margin-bottom: 30px;
        padding: 20px;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 15px;
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      }

      h1 {
        font-size: 2.5rem;
        margin-bottom: 10px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      }

      .subtitle {
        font-size: 1.2rem;
        opacity: 0.9;
      }

      .camera-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-bottom: 30px;
      }

      .video-wrapper {
        position: relative;
        width: 100%;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        background: #000;
      }

      #videoElement {
        width: 100%;
        height: auto;
        display: block;
        cursor: crosshair;
      }

      .focus-indicator {
        position: absolute;
        width: 60px;
        height: 60px;
        border: 2px solid #00ffcc;
        border-radius: 50%;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s;
        box-shadow: 0 0 15px #00ffcc;
      }

      .controls {
        display: flex;
        justify-content: center;
        gap: 15px;
        flex-wrap: wrap;
      }

      button {
        padding: 12px 25px;
        font-size: 1rem;
        background: rgba(255, 255, 255, 0.15);
        color: white;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.3s ease;
        backdrop-filter: blur(5px);
      }

      button:hover {
        background: rgba(255, 255, 255, 0.25);
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }

      button:active {
        transform: translateY(0);
      }

      #startCamera {
        background: rgba(0, 150, 255, 0.3);
        border-color: rgba(0, 150, 255, 0.5);
      }

      .status {
        margin-top: 20px;
        padding: 15px;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 10px;
        text-align: center;
        min-height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
      }

      .instructions {
        margin-top: 30px;
        padding: 20px;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 15px;
        line-height: 1.6;
      }

      .instructions h2 {
        margin-bottom: 15px;
        text-align: center;
      }

      .instructions ul {
        list-style-type: none;
        padding-left: 10px;
      }

      .instructions li {
        margin-bottom: 10px;
        padding-left: 25px;
        position: relative;
      }

      .instructions li:before {
        content: '•';
        color: #00ffcc;
        font-size: 1.5rem;
        position: absolute;
        left: 0;
        top: -5px;
      }

      footer {
        margin-top: 30px;
        text-align: center;
        opacity: 0.7;
        font-size: 0.9rem;
      }

      @media (max-width: 768px) {
        h1 {
          font-size: 2rem;
        }

        .subtitle {
          font-size: 1rem;
        }

        button {
          padding: 10px 20px;
          font-size: 0.9rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>摄像头手动聚焦功能</h1>
        <p class="subtitle">点击画面任意位置进行手动对焦</p>
      </header>

      <div class="camera-container">
        <div class="video-wrapper">
          <video id="videoElement" autoplay playsinline></video>
          <div class="focus-indicator" id="focusIndicator"></div>
        </div>

        <div class="controls">
          <button id="startCamera">启用摄像头</button>
          <button id="stopCamera">关闭摄像头</button>
          <button id="autoFocus">自动对焦</button>
        </div>

        <div class="status" id="status">请点击"启用摄像头"按钮开始使用</div>
      </div>

      <div class="instructions">
        <h2>使用说明</h2>
        <ul>
          <li>点击"启用摄像头"按钮授权访问您的摄像头</li>
          <li>在摄像头画面上点击任意位置进行手动对焦</li>
          <li>点击"自动对焦"按钮切换回自动对焦模式</li>
          <li>点击"关闭摄像头"按钮停止摄像头流</li>
          <li>手动对焦功能需要摄像头硬件支持，某些设备可能无法使用</li>
        </ul>
      </div>

      <footer>
        <p>摄像头手动聚焦演示 &copy; 2023</p>
      </footer>
    </div>

    <script>
      // 获取DOM元素
      const videoElement = document.getElementById('videoElement')
      const startCameraButton = document.getElementById('startCamera')
      const stopCameraButton = document.getElementById('stopCamera')
      const autoFocusButton = document.getElementById('autoFocus')
      const statusElement = document.getElementById('status')
      const focusIndicator = document.getElementById('focusIndicator')

      let stream = null
      let imageCapture = null

      // 启用摄像头
      async function startCamera() {
        try {
          statusElement.textContent = '正在请求摄像头权限...'

          // 获取摄像头媒体流
          stream = await navigator.mediaDevices.getUserMedia({
            video: {
              width: { ideal: 1280 },
              height: { ideal: 720 }
            }
          })

          // 将媒体流设置为视频源
          videoElement.srcObject = stream

          // 获取视频轨道
          const videoTrack = stream.getVideoTracks()[0]

          // 检查是否支持ImageCapture API
          if ('ImageCapture' in window) {
            imageCapture = new ImageCapture(videoTrack)

            // 检查是否支持手动对焦
            const capabilities = videoTrack.getCapabilities()
            if (capabilities.focusMode && capabilities.focusMode.includes('manual')) {
              statusElement.textContent = '摄像头已启用 - 点击画面进行手动对焦'
            } else {
              statusElement.textContent = '摄像头已启用 - 您的设备不支持手动对焦'
            }
          } else {
            statusElement.textContent = '摄像头已启用 - 您的浏览器不支持手动对焦功能'
          }
        } catch (error) {
          console.error('获取摄像头失败:', error)
          statusElement.textContent = '获取摄像头失败: ' + error.message
        }
      }

      // 关闭摄像头
      function stopCamera() {
        if (stream) {
          // 停止所有媒体轨道
          stream.getTracks().forEach((track) => track.stop())
          videoElement.srcObject = null
          stream = null
          imageCapture = null
          statusElement.textContent = '摄像头已关闭'
        }
      }

      // 设置手动对焦
      async function setManualFocus(x, y) {
        if (!imageCapture) return

        try {
          // 获取视频轨道
          const videoTrack = stream.getVideoTracks()[0]
          const capabilities = videoTrack.getCapabilities()
          const settings = videoTrack.getSettings()

          // 检查是否支持手动对焦
          if (!capabilities.focusMode || !capabilities.focusMode.includes('manual')) {
            statusElement.textContent = '您的摄像头不支持手动对焦'
            return
          }

          // 计算点击位置相对于视频的坐标
          const rect = videoElement.getBoundingClientRect()
          const relativeX = (x - rect.left) / rect.width
          const relativeY = (y - rect.top) / rect.height

          // 显示对焦指示器
          focusIndicator.style.left = `${x - rect.left - 30}px`
          focusIndicator.style.top = `${y - rect.top - 30}px`
          focusIndicator.style.opacity = '1'

          // 设置对焦点（需要摄像头支持）
          await imageCapture.setOptions({
            pointsOfInterest: [{ x: relativeX, y: relativeY }]
          })

          statusElement.textContent = `手动对焦已设置 (${Math.round(relativeX * 100)}%, ${Math.round(relativeY * 100)}%)`

          // 2秒后隐藏对焦指示器
          setTimeout(() => {
            focusIndicator.style.opacity = '0'
          }, 2000)
        } catch (error) {
          console.error('设置手动对焦失败:', error)
          statusElement.textContent = '设置手动对焦失败，您的设备可能不支持此功能'
        }
      }

      // 设置自动对焦
      async function setAutoFocus() {
        if (!imageCapture) return

        try {
          // 获取视频轨道
          const videoTrack = stream.getVideoTracks()[0]
          const capabilities = videoTrack.getCapabilities()

          // 检查是否支持自动对焦
          if (!capabilities.focusMode || !capabilities.focusMode.includes('continuous')) {
            statusElement.textContent = '您的摄像头不支持自动对焦'
            return
          }

          // 设置自动对焦模式
          await imageCapture.setOptions({
            focusMode: 'continuous'
          })

          statusElement.textContent = '已切换为自动对焦模式'
        } catch (error) {
          console.error('设置自动对焦失败:', error)
          statusElement.textContent = '设置自动对焦失败'
        }
      }

      // 事件监听
      startCameraButton.addEventListener('click', startCamera)
      stopCameraButton.addEventListener('click', stopCamera)
      autoFocusButton.addEventListener('click', setAutoFocus)

      // 点击视频进行手动对焦
      videoElement.addEventListener('click', (event) => {
        if (!stream) {
          statusElement.textContent = '请先启用摄像头'
          return
        }

        const x = event.clientX
        const y = event.clientY

        setManualFocus(x, y)
      })

      // 页面卸载时关闭摄像头
      window.addEventListener('beforeunload', () => {
        if (stream) {
          stopCamera()
        }
      })
    </script>
  </body>
</html>
